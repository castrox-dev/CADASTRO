{% if messages %}
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000;" id="djangoMessagesContainer">
    {% for message in messages %}
    <div class="toast align-items-center {% if message.tags == 'warning' %}text-dark{% else %}text-white{% endif %} border-0 bg-{% if message.tags == 'error' %}danger{% elif message.tags == 'debug' %}secondary{% elif message.tags %}{{ message.tags }}{% else %}primary{% endif %}"
         role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4500">
        <div class="d-flex">
            <div class="toast-body">{{ message }}</div>
            <button type="button" class="btn-close {% if message.tags != 'warning' %}btn-close-white{% endif %} me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>
    {% endfor %}
</div>
<script>
(function showDjangoMessagesAsToasts() {
    function run() {
        if (!window.bootstrap || !window.bootstrap.Toast) {
            return setTimeout(run, 60);
        }
        document.querySelectorAll('#djangoMessagesContainer .toast').forEach(function (el) {
            bootstrap.Toast.getOrCreateInstance(el, { delay: 4500 }).show();
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
    } else {
        run();
    }
})();
</script>
{% endif %}
