{% extends "base.html" %}
{% load static %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark navbar-fibramar">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="{% static 'img/logo2.webp' %}" alt="Fibramar" style="height: 35px;" class="me-2">
            <span class="fw-bold">CONSULTORES</span>
        </a>
        <div class="navbar-nav ms-auto align-items-center">
            <a href="{% url 'standard_scripts' %}" class="btn-navbar-custom me-3">
                <i class="bi bi-file-earmark-text me-2" aria-hidden="true"></i> Scripts Padrões
            </a>
            <button class="theme-toggle me-3" id="themeToggle" title="Alternar Tema" aria-label="Alternar tema claro/escuro">
                <i class="bi bi-moon-fill" id="themeIcon" aria-hidden="true"></i>
            </button>
            <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Olá, <strong>{{ user.first_name }}</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                    <li>
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item">Sair do Sistema</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

{% include "cadastros/_dashboard_inner.html" %}
{% endblock %}
