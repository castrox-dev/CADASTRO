{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}FIBRAMAR{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/theme-pro.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    <!-- Custom Toast Notification System -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000;">
        <div id="fibramarToast" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    <!-- Message here -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true" aria-labelledby="confirmTitle">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary" id="confirmTitle">Confirmação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body py-4">
                    <p class="mb-0 fs-5" id="confirmMessage">Tem certeza que deseja realizar esta ação?</p>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light px-4 fw-bold" data-bs-dismiss="modal">CANCELAR</button>
                    <button type="button" class="btn btn-danger px-4 fw-bold" id="confirmBtnAction">CONFIRMAR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Info Modal (logs, listas longas) -->
    <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true" aria-labelledby="infoModalTitle">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
                <div class="modal-header">
                    <h5 class="modal-title" id="infoModalTitle">Informação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="infoModalBody"></div>
            </div>
        </div>
    </div>

    <!-- Loader global em tela cheia (chamado por showLoader/hideLoader) -->
    <div id="fibramarLoader" class="fibramar-loader" aria-hidden="true" role="status" aria-live="polite">
        <div class="fibramar-loader__card">
            <div class="fibramar-loader__spinner" aria-hidden="true">
                <span class="fibramar-loader__ring"></span>
                <span class="fibramar-loader__ring fibramar-loader__ring--2"></span>
                <i class="bi bi-cloud-arrow-up-fill fibramar-loader__icon" id="fibramarLoaderIcon"></i>
            </div>
            <div class="fibramar-loader__title" id="fibramarLoaderTitle">Processando...</div>
            <div class="fibramar-loader__step" id="fibramarLoaderStep">Conectando ao servidor</div>
            <ol class="fibramar-loader__progress" id="fibramarLoaderProgress" hidden></ol>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script>
        // Check for saved theme (RUN IMMEDIATELY)
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
        })();

        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        // Sync icon on load
        updateThemeIcon(body.getAttribute('data-theme'));

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = body.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                
                body.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateThemeIcon(newTheme);
            });
        }

        function updateThemeIcon(theme) {
            if (!themeIcon) return;
            if (theme === 'dark') {
                themeIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
            } else {
                themeIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
            }
        }

        let confirmationCallback = null;
        const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

        function showNotify(message, type = 'primary') {
            const toastEl = document.getElementById('fibramarToast');
            const messageEl = document.getElementById('toastMessage');
            const closeBtn = toastEl.querySelector('.btn-close');
            messageEl.innerText = message;
            const isWarning = type === 'warning';
            toastEl.className = `toast align-items-center border-0 bg-${type} ${isWarning ? 'text-dark' : 'text-white'}`;
            if (closeBtn) {
                closeBtn.classList.toggle('btn-close-white', !isWarning);
            }
            const toast = bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 4500 });
            toast.show();
        }

        function showConfirm(title, message, callback, isDanger = true) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;

            const actionBtn = document.getElementById('confirmBtnAction');
            actionBtn.className = isDanger ? 'btn btn-danger px-4 fw-bold' : 'btn btn-primary px-4 fw-bold';

            confirmationCallback = callback;
            confirmModal.show();
        }

        function showInfo(title, htmlContent) {
            document.getElementById('infoModalTitle').innerText = title;
            document.getElementById('infoModalBody').innerHTML = htmlContent;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('infoModal')).show();
        }

        document.getElementById('confirmBtnAction').addEventListener('click', function() {
            if (confirmationCallback) {
                confirmationCallback();
                confirmationCallback = null;
            }
            confirmModal.hide();
        });

        // ---------------------------------------------------------------
        // Loader global em tela cheia.
        //   showLoader(title, step, options?) → exibe e fixa o foco no overlay.
        //   setLoaderStep(text, opts?) → atualiza só o passo atual.
        //   hideLoader() → encerra.
        // options.steps = ['Texto 1', 'Texto 2', ...] mostra um checklist
        // animado; setLoaderStep(text, { advance: true }) marca o item atual.
        // ---------------------------------------------------------------
        (function () {
            const overlay = document.getElementById('fibramarLoader');
            if (!overlay) return;
            const titleEl = document.getElementById('fibramarLoaderTitle');
            const stepEl = document.getElementById('fibramarLoaderStep');
            const iconEl = document.getElementById('fibramarLoaderIcon');
            const progressEl = document.getElementById('fibramarLoaderProgress');
            let progressIndex = -1;

            function renderProgress(steps) {
                progressEl.innerHTML = '';
                progressIndex = -1;
                if (!steps || !steps.length) {
                    progressEl.hidden = true;
                    return;
                }
                steps.forEach(function (label) {
                    const li = document.createElement('li');
                    li.className = 'fibramar-loader__progress-item';
                    li.innerHTML = '<span class="fibramar-loader__dot" aria-hidden="true"></span><span class="fibramar-loader__progress-label">' + label + '</span>';
                    progressEl.appendChild(li);
                });
                progressEl.hidden = false;
            }

            window.showLoader = function (title, step, options) {
                options = options || {};
                titleEl.textContent = title || 'Processando...';
                stepEl.textContent = step || '';
                if (options.icon) {
                    iconEl.className = 'bi ' + options.icon + ' fibramar-loader__icon';
                } else {
                    iconEl.className = 'bi bi-cloud-arrow-up-fill fibramar-loader__icon';
                }
                renderProgress(options.steps);
                overlay.classList.add('is-active');
                overlay.setAttribute('aria-hidden', 'false');
                document.body.classList.add('fibramar-loader-open');
            };

            window.setLoaderStep = function (text, opts) {
                opts = opts || {};
                if (text) stepEl.textContent = text;
                if (!progressEl.hidden && opts.advance) {
                    const items = progressEl.querySelectorAll('.fibramar-loader__progress-item');
                    if (progressIndex >= 0 && progressIndex < items.length) {
                        items[progressIndex].classList.remove('is-current');
                        items[progressIndex].classList.add('is-done');
                    }
                    progressIndex += 1;
                    if (progressIndex < items.length) {
                        items[progressIndex].classList.add('is-current');
                    }
                }
            };

            window.hideLoader = function () {
                overlay.classList.remove('is-active');
                overlay.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('fibramar-loader-open');
                progressEl.hidden = true;
                progressEl.innerHTML = '';
                progressIndex = -1;
            };
        })();
    </script>
    <script src="{% static 'js/app_helpers.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
